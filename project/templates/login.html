{% extends 'base.html' %}
{% block content %}
<div class="container">
  <div class="form-box">
    <h2>Вход в систему</h2>
    
    <div id="error-msg" class="error-msg"></div>
    
    <script>
      if (window.location.search.includes('registered=1')) {
        let msg = document.getElementById('error-msg');
        msg.innerText = "Успешная регистрация! Теперь войдите.";
        msg.style.color = "#2e7d32";
        msg.style.background = "#e8f5e9";
        msg.style.display = "block";
      }
    </script>

    <label>Email:</label>
    <input type="email" id="email" placeholder="you@mail.ru">
    <label>Пароль:</label>
    <input type="password" id="password" placeholder="******">
    
    <button onclick="login()" class="btn" style="width:100%; margin-top: 10px;">Войти</button>
    
    <p style="text-align:center; margin-top: 20px; font-size: 14px;">
      Нет аккаунта? <a href="/register/" style="color:#ff6b35; font-weight:bold;">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
