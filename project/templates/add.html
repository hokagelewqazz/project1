{% extends 'base.html' %}
{% block content %}
<div class="container">
  <div class="form-box">
    <h2>Новый рецепт</h2>
    <label>Название:</label><input type="text" id="title">
    <label>Короткое описание:</label><input type="text" id="desc">
    <label>Время в минутах:</label><input type="number" id="time">
    <label>Ингредиенты (через запятую):</label><input type="text" id="ing">
    <label>Шаги приготовления:</label><textarea id="steps" rows="4"></textarea>
    <button onclick="addRecipe()" class="btn" style="width:100%;">Сохранить</button>
  </div>
</div>
{% endblock %}
